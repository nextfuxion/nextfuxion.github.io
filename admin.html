<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>

Panel Administrativo

</title>

<link rel="stylesheet"
href="styles.css">

</head>

<body>
<div id="adminBar"></div>
<header class="hero">

<img
src="assets/logo-horizontal.png"
class="logo"
alt="NextFuXion">

<h2>

📊 Panel Administrativo

</h2>

<a
class="btn-view"
href="index.html">

← Volver al catálogo

</a>

</header>

<section class="catalog">

<div class="card">
<h3>📦 Total Pedidos</h3>
<h2 id="totalPedidos">0</h2>
</div>

<div class="card">
<h3>👥 Clientes</h3>
<h2 id="totalClientes">0</h2>
</div>

<div class="card">
<h3>💰 Ventas Totales</h3>
<h2 id="totalVentas">$0</h2>
</div>

<div class="card">
<h3>📅 Ventas Hoy</h3>
<h2 id="ventasHoy">$0</h2>
</div>

<div class="card">
<h3>🏆 Producto Más Vendido</h3>
<h2 id="productoTop">-</h2>
</div>

<div class="card">
<h3>⭐ Mejor Cliente</h3>
<h2 id="clienteTop">-</h2>
</div>

<div class="card">
<h3>🧾 Ticket Promedio</h3>
<h2 id="ticketPromedio">$0</h2>
</div>

<div style="margin:20px 0;">

<button
onclick="exportarCSV()"
class="btn-buy">

📥 Exportar CSV

</button>

</div>

<h2>

Últimos pedidos

</h2>

<div id="ultimosPedidos">

</div>

</section>

</section>
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="admin.js"></script>
<script src="admin-bar.js"></script>
</body>

</html>
